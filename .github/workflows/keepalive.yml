name: Supabase keepalive
# Free Supabase projects pause after a period of inactivity. This reads real
# rows once a day so the project always counts as in use. If it fails, GitHub
# emails you, which is also an early warning that the database is down.
on:
  schedule:
    - cron: "0 0 * * *"   # daily, 09:00 Japan time
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install psycopg2-binary
          python - <<'PY'
          import os, psycopg2
          conn = psycopg2.connect(os.environ["DB"], connect_timeout=30)
          with conn, conn.cursor() as cur:
              cur.execute("SELECT count(*) FROM inventory")
              models = cur.fetchone()[0]
              cur.execute("SELECT count(*) FROM order_batches WHERE status = 'Pending'")
              pending = cur.fetchone()[0]
          print(f"ok: {models} models, {pending} pending orders")
          PY
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
